[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videouniq-pro"
version = "2.1.3"
description = "Пакетная уникализация видео без нейросетей"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "psutil>=5.9",
]

[project.scripts]
videouniq-pro = "videouniq.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videouniq = ["resources/*"]
